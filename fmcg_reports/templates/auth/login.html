<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – {{ company.company_name }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
:root { --brand: #1a4e8f; --accent: #f4a621; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #1a4e8f 0%, #0d2d52 60%, #f4a621 200%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Segoe UI', sans-serif;
}
.login-card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  width: 100%; max-width: 420px;
  overflow: hidden;
}
.login-header {
  background: var(--brand);
  padding: 28px 32px 22px;
  text-align: center;
  color: #fff;
}
.login-header .logo-img {
  max-height: 60px; max-width: 160px;
  object-fit: contain; margin-bottom: 10px;
}
.login-header h4 { font-weight: 700; margin: 0; font-size: 18px; }
.login-header p  { font-size: 11px; opacity: .65; margin: 4px 0 0; }
.login-body { padding: 28px 32px 32px; }
.form-label { font-weight: 600; font-size: 13px; color: #333; }
.form-control {
  border-radius: 8px; border: 1.5px solid #d0daea;
  padding: 10px 14px; font-size: 13.5px;
}
.form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26,78,143,.12); }
.btn-login {
  background: var(--brand); color: #fff; border: none;
  border-radius: 8px; padding: 11px; font-size: 14px;
  font-weight: 600; width: 100%; margin-top: 6px;
  transition: background .2s;
}
.btn-login:hover { background: #163f74; }
.input-group-text { background: #f0f4f9; border-color: #d0daea; border-radius: 8px 0 0 8px; }
.alert { border-radius: 8px; font-size: 13px; }
.footer-text { text-align: center; font-size: 11px; color: #aaa; margin-top: 16px; }
.accent-bar { height: 4px; background: var(--accent); }
</style>
</head>
<body>

<div class="login-card">
  <div class="accent-bar"></div>
  <div class="login-header">
    {% if company.logo_path %}
    <img src="{{ url_for('static', filename=company.logo_path) }}" alt="Logo" class="logo-img"><br>
    {% else %}
    <i class="bi bi-bar-chart-fill" style="font-size:36px;color:var(--accent)"></i><br>
    {% endif %}
    <h4>{{ company.company_name }}</h4>
    <p>Reporting Suite — Sign In</p>
  </div>

  <div class="login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">
        <i class="bi bi-exclamation-circle-fill me-1"></i>{{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login" autocomplete="off">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill text-muted"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="Enter username" required autofocus
                 style="border-radius:0 8px 8px 0">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
          <input type="password" name="password" id="pwdField" class="form-control"
                 placeholder="Enter password" required
                 style="border-radius:0 8px 8px 0">
          <button type="button" class="btn btn-outline-secondary btn-sm px-2"
                  style="border-radius:0 8px 8px 0;border-color:#d0daea"
                  onclick="togglePwd()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <p class="footer-text mt-3">
      <i class="bi bi-shield-lock me-1"></i>Secure session &bull; Access controlled
    </p>
  </div>
</div>

<script>
function togglePwd() {
  const f = document.getElementById('pwdField');
  const e = document.getElementById('eyeIcon');
  if (f.type === 'password') { f.type = 'text';     e.className = 'bi bi-eye-slash'; }
  else                        { f.type = 'password'; e.className = 'bi bi-eye'; }
}
</script>
</body>
</html>
